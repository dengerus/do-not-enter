<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Важное сообщение</title>
    <style>
        /* Белый фон, по центру */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #111111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Огромная надпись с буквами разного цвета (12 символов) */
        .multicolor-title {
            font-size: 4.5rem;
            font-weight: 900;
            margin-bottom: 30px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        /* Каждая буква и тире — свой цвет */
        .c1 { color: #FF0055; } /* Д */
        .c2 { color: #FF5722; } /* В */
        .c3 { color: #FF9800; } /* И */
        .c4 { color: #4CAF50; } /* Н */
        .c5 { color: #00BCD4; } /* Е */
        .c6 { color: #3F51B5; } /* Ш */
        .c7 { color: #9C27B0; } /* С */
        .c8 { color: #E91E63; } /* Я */
        .c9 { color: #795548; } /* - */
        .c10 { color: #009688; }/* Г */
        .c11 { color: #607D8B; }/* Е */
        .c12 { color: #FFC107; }/* Й */

        /* Большой контейнер для гифки */
        .gif-container {
            margin-bottom: 20px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 4px solid #eaeaea;
        }

        .gif-container img {
            max-width: 500px;
            width: 100%;
            height: auto;
            display: block;
        }

        /* Крупная и заметная надпись в левом нижнем углу */
        .footer-note {
            position: fixed;
            bottom: 20px;
            left: 25px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #333333;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-style: italic;
        }

        /* Адаптивность для экранов телефонов */
        @media (max-width: 768px) {
            .multicolor-title {
                font-size: 2.2rem;
                letter-spacing: 1px;
            }
            .gif-container img {
                max-width: 320px;
            }
            .footer-note {
                font-size: 1rem;
                bottom: 10px;
                left: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Разноцветная фраза (строго 12 символов: ДВИНЕШСЯ-ГЕЙ) -->
    <div class="multicolor-title">
        <span class="c1">Д</span><span class="c2">В</span><span class="c3">И</span><span class="c4">Н</span><span class="c5">Е</span><span class="c6">Ш</span><span class="c7">С</span><span class="c8">Я</span><span class="c9">-</span><span class="c10">Г</span><span class="c11">Е</span><span class="c12">Й</span>
    </div>

    <!-- Увеличенный блок с гифкой-рикроллом -->
    <div class="gif-container">
        <img src="https://media.giphy.com/media/Vuw9m5wXviFIQ/giphy.gif" alt="rickroll" id="rickroll.gif">
    </div>

    <!-- Заметная надпись в левом углу -->
    <div class="footer-note">
        живи с этим...
    </div>

</body>
</html>
