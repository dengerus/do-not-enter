<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой классный сайт</title>
    <style>
        /* Здесь мы пишем стили (CSS) */
        body {
            background-color: #f0f2f5; /* Цвет фона страницы */
            font-family: Arial, sans-serif; /* Красивый шрифт */
            text-align: center; /* Текст по центру */
            padding-top: 50px;
        }
        h1 {
            color: #333333; /* Цвет заглавного текста */
        }
        p {
            color: #666666;
            font-size: 18px;
        }
        .button {
            display: inline-block;
            background-color: #007bff; /* Цвет кнопки */
            color: white; /* Цвет текста на кнопке */
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px; /* Скругленные углы */
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Привет, мир! 🚀</h1>
    <p>Это мой личный сайт, и я сам научился его делать.</p>
    <a class="button" href="https://github.com/DENpro737" target="_blank">Мой GitHub</a>
</body>
</html>
